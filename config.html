<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #replayPreviewResults table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
      #replayPreviewResults th, #replayPreviewResults td { padding: 6px 8px; border: 1px solid #bbb; white-space: nowrap; text-align: left; }
      #replayPreviewResults pre { max-height: 60vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
      #replayPreviewStatus { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <button id="addReplaysBtn">Додати ріплеї</button>
    <button id="addStreamBtn">Додати стрім</button>
    <button id="deleteBtn">Delete data</button>
    <button id="addMatchInfoBtn">Add info</button>
    <button id="playersRoleBtn">Ролі гравців</button>
    <fieldset>
      <legend>Тестовий парсинг реплею</legend>
      <label for="replayPreviewFile">Назва файлу в папці replays:</label>
      <input id="replayPreviewFile" type="text" placeholder="8812312611.dem" />
      <button id="parseReplayPreviewBtn" type="button">Розпарсити для перегляду</button>
      <p id="replayPreviewStatus" role="status" aria-live="polite"></p>
      <div id="replayPreviewResults"></div>
    </fieldset>

    <div>
      <label for="replayNumberDelete">Replay ID:</label>
      <input id="replayNumberDelete" type="text" />
    </div>
    <fieldset>
      <legend>Посилання на стріми</legend>
      <div><label for="streamUrlPavlo">Павло:</label> <input id="streamUrlPavlo" type="url" placeholder="https://..." /></div>
      <div><label for="streamUrlVladik">Владік:</label> <input id="streamUrlVladik" type="url" placeholder="https://..." /></div>
      <div><label for="streamUrlKatia">Катя:</label> <input id="streamUrlKatia" type="url" placeholder="https://..." /></div>
      <button id="saveStreamsBtn" type="button">Зберегти посилання</button>
      <span id="streamsStatus" role="status" aria-live="polite"></span>
    </fieldset>
    <div>
      <label for="matchDate">Date:</label>
      <input id="matchDateInput" value="2026-10-04" style="color: #a78bfa" />
      T
      <input id="matchTimeInput" value="22:00" />
    </div>

    <script type="module" src="config.js"></script>
  </body>
</html>
